# Vyra drop-in for plasma-krunner.service (run 26 fix).
# Run-24/25 root cause (docs/KRUNNER_INVESTIGATION.md): the shipped unit
# has TimeoutSec=5sec; D-Bus activation routes through systemd and
# krunner must claim org.kde.krunner within 5 s or the start job is
# killed. Under TCG (and on slow ENTRY-class hardware) krunner startup
# exceeds 5 s, so Alt+F2 fails with "startup job failed". 60 s gives
# slow starts room; on fast hardware the timeout never comes into play.
[Service]
TimeoutStartSec=60s
