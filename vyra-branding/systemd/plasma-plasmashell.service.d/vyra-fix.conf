# Vyra drop-in for plasma-plasmashell.service (run 26 fix).
# Run-25 root cause (docs/PLASMASHELL_RACE_INVESTIGATION.md): the shell's
# load() gate waits on a single-shot async D-Bus reply from
# kactivitymanagerd (KActivities::Controller::serviceStatus() == Running)
# with no retry and no error log; under slow startup the daemon answers
# too late, the gate aborts the load, and the desktop never renders.
# After=+Wants= starts kactivitymanagerd first and — because its unit is
# effectively Type=dbus — systemd waits until it has claimed
# org.kde.ActivityManager before starting the shell, so the gate is
# already satisfied. Wants= (not Requires=) degrades to current behaviour
# if kactivitymanagerd fails. TimeoutSec=120 covers the separate 40 s
# cold-start kill under TCG (first-instance wall times 40.394/40.523 s
# match TimeoutSec=40sec exactly).
[Unit]
After=plasma-kactivitymanagerd.service
Wants=plasma-kactivitymanagerd.service

[Service]
TimeoutSec=120sec
