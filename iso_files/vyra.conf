# Anaconda configuration profile for Vyra OS.
# Installed to /etc/anaconda/profile.d/vyra.conf by iso_files/configure_iso.sh.
# Pattern: ublue-os/bluefin iso_files/configure_iso_anaconda.sh (bluefin.conf).
#
# The core image sets os-release ID=vyra (ID_LIKE=fedora kept for Fedora
# tooling), so this profile matches on os_id=vyra. If os_id ever stops
# matching the core image's ID, Anaconda falls back to the built-in fedora
# profile (RWID/OS lesson 1: no matching profile means the text installer).
#
# User / Password / Network spokes are intentionally NOT hidden: the live
# installer is how the first user account is created — no first-boot user
# setup exists yet in 0.1. (Bluefin hides them because its first-boot
# setup creates the user; Vyra has no equivalent yet.)
#
# The Vyra installer stylesheet (Batch 01, Phase D): Obsidian + gold theme
# (vyra.css) plus the wordmark logo, installed by configure_iso.sh into
# /usr/share/anaconda/pixmaps/. Fedora 45's Anaconda has no sidebar/topbar
# pixmaps to replace — the theme is colour + logo, via custom_stylesheet.

[Profile]
# Define the profile.
profile_id = vyra

[Profile Detection]
# Match os-release values.
os_id = vyra

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
# efi_dir stays fedora: it is the on-disk EFI vendor directory
# (EFI/fedora/) where the Fedora-signed shim/grub live, not branding.
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[Localization]
use_geolocation = False

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/vyra/vyra.css
# The default browser for the Web UI (matches the stock fedora profile).
webui_web_engine = firefox
