name: Vyra Foundation Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  container-build:
    # Build the Vyra OS bootc image and push it to GHCR. The ISO jobs pull
    # it from there — this is the canonical pattern (ublue-os/image-template,
    # AeroCore-OS, fp-os, Aurora-LTS, Margine): the image-builder action
    # runs against a registry image, never a locally-built one, and never
    # under Docker (bootc-image-builder is Podman-only).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Placeholder CA file
        # The Containerfile bind-mounts certs/hatch-egress-ca.crt in each dnf
        # RUN. On the sandbox VM that file holds the real egress CA; on CI it
        # must exist but stay EMPTY, so scripts/sandbox-ca.sh skips trusting
        # it and dnf just works (no MITM proxy on GitHub runners).
        run: |
          mkdir -p certs
          touch certs/hatch-egress-ca.crt
      - name: Build development image
        run: podman build -t localhost/vyra-os:ci -f Containerfile .
      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman push localhost/vyra-os:ci ghcr.io/danteleach/vyra-os:ci

  qcow2-smoke:
    # Bootable disk image (qcow2) from the GHCR image, via the official
    # osbuild/bootc-image-builder-action. This is the DIAGNOSTIC job: if
    # qcow2 builds and boots in QEMU, the image is good and the problem was
    # the ISO type / installer; if it fails the same way, the image itself
    # is suspect. (Margine and bazzite-tower both keep BIB for qcow2 only.)
    #
    # History: the previous iso-build job built an anaconda-iso with this
    # action (run #8, 2026-11-25 — it built and booted, but it is an
    # automated installer-only ISO on a deprecated path). anaconda-iso is
    # deprecated upstream (osbuild.org: "on its way out — prefer
    # bootc-generic-iso or bootc-installer"), the builder container
    # (quay.io/centos-bootc/bootc-image-builder:latest) has been frozen
    # since the repo was archived 2026-06-18, before Fedora 45 GA, and
    # Universal Blue retired anaconda-iso in Mar 2025 (Margine Jun 2026).
    # The installer-only ISO can never be a live desktop, and its install
    # stalled in QEMU (see docs/INSTALL_DEEP_DIVE_2026-11-26.md). The live
    # ISO is now built by the build-live-iso job (Titanoboa). This job
    # keeps the bib action for the qcow2 smoke test only.
    #
    # Runs #1–#6 (2026-11-25) ran bib by hand (podman, then Docker, with
    # a local registry, then with podman storage mounted) and failed every
    # time — manifest/rootfs errors, a --pull typo, a missing
    # container-storage mount, and an osbuild mount denial. Research
    # (2026-11-25) found no project doing it the hand-rolled way: every
    # working project uses this action on pinned ubuntu-24.04 with the
    # image pulled from GHCR.
    runs-on: ubuntu-24.04
    needs: container-build
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare environment
        run: |
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check free disk
        run: df -h
      # BIB #446 workaround: a Podman store created by another Podman
      # invocation can mismatch the storage driver the builder expects.
      # Resetting it is harmless on a fresh runner; the action pulls the
      # image from GHCR anyway.
      - name: Reset podman storage
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf
      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@30960621b85c9e76c653082f9ef4cab5a10210d5 # main
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./config/bootc-image-builder.toml
          image: ghcr.io/danteleach/vyra-os:ci
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: qcow2
          rootfs: btrfs
          additional-args: --use-librepo=True
      - name: Check free disk after build
        run: df -h
      - name: Upload qcow2
        uses: actions/upload-artifact@v4
        with:
          name: vyra-os-0.1.0-dev-qcow2
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-live-iso:
    # Ubuntu-style live ISO: boot to a live Plasma desktop, try the OS,
    # install from the desktop. Built with ublue-os/titanoboa (the live-ISO
    # builder Bluefin/Bazzite/Aurora/Margine ship) from the installer
    # payload image (installer/Containerfile.live), which layers the live
    # session + Anaconda onto the Vyra core image and embeds the install
    # image in its container storage, so install works OFFLINE — the
    # install-time registry pull is what stalled the 0.1.0-dev installs
    # (see docs/INSTALL_DEEP_DIVE_2026-11-26.md).
    #
    # Titanoboa pin: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
    # (main @ 2026-05-19, commit #138 "Only use container images as the only
    # source of truth"; no tagged release to pin — the same pin
    # bazzite-tower uses). WARNING: that commit removed the action's
    # hook/flatpak/kargs/container-image inputs — the current action takes
    # ONLY image-ref and iso-dest. All live-session config must already be
    # baked into the payload image (iso_files/configure_iso.sh does that);
    # there is no hook-post-rootfs or netinstall input to set. Do not add
    # inputs the action does not declare. The embedded payload (the
    # netinstall=0 behaviour) comes from the nested `podman pull` inside
    # the payload build, not from an action input.
    runs-on: ubuntu-24.04
    needs: container-build
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      # Root cause of a deterministic Titanoboa failure (bazzite-tower
      # issue #47 / PR #48): the ubuntu-24.04 runner's podman bundle
      # switched rootful podman to overlay.mount_program=fuse-overlayfs,
      # and the payload build's NESTED `podman pull` then writes whiteouts
      # as literal `.wh.<name>` files, which fuse-overlayfs rejects with
      # EINVAL. Native kernel overlayfs has no such restriction. Pin it
      # job-globally before ANY rootful podman use (both this build and
      # the titanoboa action read the same root storage).
      - name: Use native kernel overlayfs for rootful podman
        run: |
          set -euo pipefail
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf
          # `podman system reset` reads the store's own recorded graph driver
          # before it can clear it, so it can fail for the exact same reason
          # it's meant to fix — hence the guarded reset, explicit recursive
          # unmount, and rm -rf below (bazzite-tower build-iso.yml).
          sudo podman system reset -f 2>/dev/null || true
          sudo umount -R /var/lib/containers/storage /run/containers/storage 2>/dev/null || true
          sudo rm -rf /var/lib/containers/storage /run/containers/storage
          sudo podman info --format 'driver={{.Store.GraphDriverName}} options={{.Store.GraphOptions}}'
          # Fail loudly if the mount_program override somehow survived — a
          # silent fallback would reintroduce the exact failure this step
          # exists to prevent.
          if sudo podman info --format '{{.Store.GraphOptions}}' | grep -q mount_program; then
            echo "::error::rootful podman still uses a mount_program (fuse-overlayfs); native overlayfs pin failed"
            exit 1
          fi
      - name: Check free disk
        run: df -h
      # The payload image is the live session + Anaconda, built FROM the
      # core image. Privileged build: iso_files/configure_iso.sh runs a
      # nested `podman pull` (embedding the core image for offline
      # install) and a dracut regen. --squash keeps the payload one layer.
      # Build context is the repo root (the Containerfile COPYs iso_files/
      # and installer/iso.yaml); .containerignore keeps .git/artifacts out.
      - name: Build live-ISO payload
        run: |
          set -euo pipefail
          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --squash \
            --build-arg BASE_IMAGE=ghcr.io/danteleach/vyra-os:ci \
            -f installer/Containerfile.live \
            -t localhost/vyra-os-payload:ci .
      # Titanoboa same-file trap (run #18, 2026-11-26): the action runs from
      # its own directory and builds the ISO into <action-path>/output/
      # (TITANOBOA_OUTPUT_DIR defaults to ./output). It then computes the
      # destination with `realpath --relative-base=$GITHUB_WORKSPACE` +
      # `realpath -m`, which resolves RELATIVE TO THE ACTION DIRECTORY — so
      # an iso-dest of $GITHUB_WORKSPACE/output/Vyra-OS-Live.iso resolves
      # to <action-path>/output/Vyra-OS-Live.iso, the exact file it just
      # built, and `mv` fails with "are the same file". The ISO itself
      # built fine (xorriso completed, 1,371,096 sectors); only the move
      # failed, so no artifact was uploaded. Fix: point iso-dest at the
      # workspace ROOT (no output/ subdir), so the resolved destination
      # (<action-path>/Vyra-OS-Live.iso) differs from the built file
      # (<action-path>/output/Vyra-OS-Live.iso). No pre-create step is
      # needed: realpath only requires the parent dir to exist, and the
      # workspace root always does. The old "Prepare ISO destination"
      # step (pre-creating output/Vyra-OS-Live.iso) is removed — it
      # addressed a `realpath` failure that does not occur, and the
      # action never wrote to that path.
      - name: Build live ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main @ 2026-05-19 (#138); mid-revamp, no tagged release to pin
        with:
          image-ref: localhost/vyra-os-payload:ci
          iso-dest: ${{ github.workspace }}/Vyra-OS-Live.iso
      - name: Stage ISO + checksum
        id: stage
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          UPLOAD_DIR="${{ github.workspace }}/upload"
          mkdir -p "${UPLOAD_DIR}"
          mv "${ISO_PATH}" "${UPLOAD_DIR}/"
          ISO_NAME="$(basename "${ISO_PATH}")"
          ( cd "${UPLOAD_DIR}" && sha256sum "${ISO_NAME}" | tee "${ISO_NAME}-CHECKSUM" )
          echo "upload-dir=${UPLOAD_DIR}" >> "${GITHUB_OUTPUT}"
      - name: Check free disk after build
        run: df -h
      - name: Upload live ISO
        uses: actions/upload-artifact@v4
        with:
          name: vyra-os-0.1.0-dev-live-iso
          path: ${{ steps.stage.outputs.upload-dir }}
          if-no-files-found: error
          # A live ISO is several GB; GitHub Free includes only 500 MB of
          # artifact storage on private repos (public repos are free). A
          # 7-day retention keeps the storage cost to pennies and stops
          # old ISOs piling up. Download the ISO promptly after the run
          # finishes — for public distribution use Internet Archive
          # (see docs/ISO_SPLIT_PACKS.md), not release assets: GitHub
          # caps each release file at 2 GiB.
          retention-days: 7
          compression-level: 0
