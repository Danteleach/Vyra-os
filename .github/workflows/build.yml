name: Vyra Foundation Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  container-build:
    # Build the Vyra OS bootc image and push it to GHCR. The ISO jobs pull
    # it from there — this is the canonical pattern (ublue-os/image-template,
    # AeroCore-OS, fp-os, Aurora-LTS, Margine): the image-builder action
    # runs against a registry image, never a locally-built one, and never
    # under Docker (bootc-image-builder is Podman-only).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Placeholder CA file
        # The Containerfile bind-mounts certs/hatch-egress-ca.crt in each dnf
        # RUN. On the sandbox VM that file holds the real egress CA; on CI it
        # must exist but stay EMPTY, so scripts/sandbox-ca.sh skips trusting
        # it and dnf just works (no MITM proxy on GitHub runners).
        run: |
          mkdir -p certs
          touch certs/hatch-egress-ca.crt
      - name: Build development image
        run: podman build -t localhost/vyra-os:ci -f Containerfile .
      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman push localhost/vyra-os:ci ghcr.io/danteleach/vyra-os:ci

  qcow2-smoke:
    # Bootable disk image (qcow2) from the GHCR image, via the official
    # osbuild/bootc-image-builder-action. This is the DIAGNOSTIC job: if
    # qcow2 builds and boots in QEMU, the image is good and the problem was
    # the ISO type / installer; if it fails the same way, the image itself
    # is suspect. (Margine and bazzite-tower both keep BIB for qcow2 only.)
    #
    # History: the previous iso-build job built an anaconda-iso with this
    # action (run #8, 2026-11-25 — it built and booted, but it is an
    # automated installer-only ISO on a deprecated path). anaconda-iso is
    # deprecated upstream (osbuild.org: "on its way out — prefer
    # bootc-generic-iso or bootc-installer"), the builder container
    # (quay.io/centos-bootc/bootc-image-builder:latest) has been frozen
    # since the repo was archived 2026-06-18, before Fedora 45 GA, and
    # Universal Blue retired anaconda-iso in Mar 2025 (Margine Jun 2026).
    # The installer-only ISO can never be a live desktop, and its install
    # stalled in QEMU (see docs/INSTALL_DEEP_DIVE_2026-11-26.md). The live
    # ISO is now built by the build-live-iso job (Titanoboa). This job
    # keeps the bib action for the qcow2 smoke test only.
    #
    # Runs #1–#6 (2026-11-25) ran bib by hand (podman, then Docker, with
    # a local registry, then with podman storage mounted) and failed every
    # time — manifest/rootfs errors, a --pull typo, a missing
    # container-storage mount, and an osbuild mount denial. Research
    # (2026-11-25) found no project doing it the hand-rolled way: every
    # working project uses this action on pinned ubuntu-24.04 with the
    # image pulled from GHCR.
    runs-on: ubuntu-24.04
    needs: container-build
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare environment
        run: |
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check free disk
        run: df -h
      # BIB #446 workaround: a Podman store created by another Podman
      # invocation can mismatch the storage driver the builder expects.
      # Resetting it is harmless on a fresh runner; the action pulls the
      # image from GHCR anyway.
      - name: Reset podman storage
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf
      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@30960621b85c9e76c653082f9ef4cab5a10210d5 # main
        with:
                    -f installer/Containerfile.live \
            -t localhost/vyra-os-payload:ci .
      # Work around the titanoboa action's iso-dest handling: it runs plain
      # `realpath` on the destination *before* creating it, which errors when
      # the path doesn't exist yet. Pre-create the dir + an empty file so
      # realpath resolves; the action then moves the built ISO over it.
      # (bazzite-tower build-iso.yml.)
      - name: Prepare ISO destination
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/output"
          : > "${{ github.workspace }}/output/Vyra-OS-Live.iso"
      - name: Build live ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main @ 2026-05-19 (#138); mid-revamp, no tagged release to pin
        with:
          image-ref: localhost/vyra-os-payload:ci
          iso-dest: ${{ github.workspace }}/output/Vyra-OS-Live.iso
      - name: Stage ISO + checksum
        id: stage
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          UPLOAD_DIR="${{ github.workspace }}/upload"
          mkdir -p "${UPLOAD_DIR}"
          mv "${ISO_PATH}" "${UPLOAD_DIR}/"
          ISO_NAME="$(basename "${ISO_PATH}")"
          ( cd "${UPLOAD_DIR}" && sha256sum "${ISO_NAME}" | tee "${ISO_NAME}-CHECKSUM" )
          echo "upload-dir=${UPLOAD_DIR}" >> "${GITHUB_OUTPUT}"
      - name: Check free disk after build
        run: df -h
      - name: Upload live ISO
        uses: actions/upload-artifact@v4
        with:
          name: vyra-os-0.1.0-dev-live-iso
          path: ${{ steps.stage.outputs.upload-dir }}
          if-no-files-found: error
          # A live ISO is several GB; GitHub Free includes only 500 MB of
          # artifact storage on private repos (public repos are free). A
          # 7-day retention keeps the storage cost to pennies and stops
          # old ISOs piling up. Download the ISO promptly after the run
          # finishes — for public distribution use Internet Archive
          # (see docs/ISO_SPLIT_PACKS.md), not release assets: GitHub
          # caps each release file at 2 GiB.
          retention-days: 7
          compression-level: 0
